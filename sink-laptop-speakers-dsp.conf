# Speaker DSP for Lenovo LOQ 16IRH8 (Realtek ALC257 internal speakers)  -- generated, v7 (multiband)
# Signal flow per channel:
#   in -> correction EQ -> 3-band crossover (500 Hz / 3 kHz) -> per-band compressor -> mix -> limiter -> speakers
#   in (L+R mono) -> virtual bass (harmonics 100-650 Hz) -> own compressor -> mixed into both channels ("Gain 4")
# After editing: systemctl --user restart pipewire pipewire-pulse wireplumber
#
# EQ fitted to a 5-position averaged phone-mic sweep (Pixel 7), 2026-11-15.
# Measured raw response: steep roll-off below ~600 Hz, broad +7 dB hump 800-1300 Hz, -3..-6 dB above 5 kHz.
# Tuning cheat-sheet (keep L and R identical):
#   hp*_     Freq   : bass cut-off; raise if rattling/crackling
#   lo_      Gain   : low-shelf below ~200 Hz
#   box_     Gain   : optional lift around 600 Hz (fit chose 0; +2..+3 for more body)
#   res_     Gain   : broad cut of the measured hump at 800-1300 Hz (main correction)
#   pres_    Gain   : small narrow cut at 3 kHz
#   air_     Gain   : treble shelf (fit chose 0; +2..+3 for more sparkle)
#   out_*    "Gain 4" : VIRTUAL BASS amount (0 = off). Also vb_comp Threshold (lower = steadier, less crackle)
#   comp_low/mid/high : per-band dynamics. Keep "Makeup gain" equal across bands or the EQ balance shifts.
#                       Lower Threshold / higher Ratio on comp_low if bass still crackles at high volume.
#   limit    Limit  : output ceiling, keep <= -0.5 dB

context.modules = [
{   name = libpipewire-module-filter-chain
    args = {
        node.description = "Speakers (DSP multiband)"
        media.name       = "Speakers (DSP multiband)"
        filter.graph = {
            nodes = [
                # ================= L channel =================
                { type = builtin name = in_L label = copy }
                # --- correction EQ (from 5-position phone measurement) ---
                { type = builtin name = hp1_L label = bq_highpass control = { "Freq" = 150.0 "Q" = 0.6 } }
                { type = builtin name = hp2_L label = bq_highpass control = { "Freq" = 150.0 "Q" = 0.6 } }
                { type = builtin name = lo_L label = bq_lowshelf control = { "Freq" = 200.0 "Q" = 0.7 "Gain" = 1.0 } }
                { type = builtin name = box_L label = bq_peaking control = { "Freq" = 600.0 "Q" = 0.9 "Gain" = 0.0 } }
                { type = builtin name = res_L label = bq_peaking control = { "Freq" = 1070.0 "Q" = 0.9 "Gain" = -12.0 } }
                { type = builtin name = pres_L label = bq_peaking control = { "Freq" = 3000.0 "Q" = 3.3 "Gain" = -2.0 } }
                { type = builtin name = air_L label = bq_highshelf control = { "Freq" = 4000.0 "Q" = 0.7 "Gain" = 0.0 } }
                # --- 3-band Linkwitz-Riley crossover (500 Hz / 3 kHz) ---
                { type = builtin name = xl1_L label = bq_lowpass control = { "Freq" = 500.0 "Q" = 0.7071 } }
                { type = builtin name = xl2_L label = bq_lowpass control = { "Freq" = 500.0 "Q" = 0.7071 } }
                { type = builtin name = xlap_L label = bq_allpass control = { "Freq" = 3000.0 "Q" = 0.7071 } }
                { type = builtin name = xr1_L label = bq_highpass control = { "Freq" = 500.0 "Q" = 0.7071 } }
                { type = builtin name = xr2_L label = bq_highpass control = { "Freq" = 500.0 "Q" = 0.7071 } }
                { type = builtin name = xm1_L label = bq_lowpass control = { "Freq" = 3000.0 "Q" = 0.7071 } }
                { type = builtin name = xm2_L label = bq_lowpass control = { "Freq" = 3000.0 "Q" = 0.7071 } }
                { type = builtin name = xh1_L label = bq_highpass control = { "Freq" = 3000.0 "Q" = 0.7071 } }
                { type = builtin name = xh2_L label = bq_highpass control = { "Freq" = 3000.0 "Q" = 0.7071 } }
                { type = builtin name = out_L label = mixer control = { "Gain 1" = 1.0 "Gain 2" = 1.0 "Gain 3" = 1.0 "Gain 4" = 2.0 } }
                # ================= R channel =================
                { type = builtin name = in_R label = copy }
                # --- correction EQ (from 5-position phone measurement) ---
                { type = builtin name = hp1_R label = bq_highpass control = { "Freq" = 150.0 "Q" = 0.6 } }
                { type = builtin name = hp2_R label = bq_highpass control = { "Freq" = 150.0 "Q" = 0.6 } }
                { type = builtin name = lo_R label = bq_lowshelf control = { "Freq" = 200.0 "Q" = 0.7 "Gain" = 1.0 } }
                { type = builtin name = box_R label = bq_peaking control = { "Freq" = 600.0 "Q" = 0.9 "Gain" = 0.0 } }
                { type = builtin name = res_R label = bq_peaking control = { "Freq" = 1070.0 "Q" = 0.9 "Gain" = -12.0 } }
                { type = builtin name = pres_R label = bq_peaking control = { "Freq" = 3000.0 "Q" = 3.3 "Gain" = -2.0 } }
                { type = builtin name = air_R label = bq_highshelf control = { "Freq" = 4000.0 "Q" = 0.7 "Gain" = 0.0 } }
                # --- 3-band Linkwitz-Riley crossover (500 Hz / 3 kHz) ---
                { type = builtin name = xl1_R label = bq_lowpass control = { "Freq" = 500.0 "Q" = 0.7071 } }
                { type = builtin name = xl2_R label = bq_lowpass control = { "Freq" = 500.0 "Q" = 0.7071 } }
                { type = builtin name = xlap_R label = bq_allpass control = { "Freq" = 3000.0 "Q" = 0.7071 } }
                { type = builtin name = xr1_R label = bq_highpass control = { "Freq" = 500.0 "Q" = 0.7071 } }
                { type = builtin name = xr2_R label = bq_highpass control = { "Freq" = 500.0 "Q" = 0.7071 } }
                { type = builtin name = xm1_R label = bq_lowpass control = { "Freq" = 3000.0 "Q" = 0.7071 } }
                { type = builtin name = xm2_R label = bq_lowpass control = { "Freq" = 3000.0 "Q" = 0.7071 } }
                { type = builtin name = xh1_R label = bq_highpass control = { "Freq" = 3000.0 "Q" = 0.7071 } }
                { type = builtin name = xh2_R label = bq_highpass control = { "Freq" = 3000.0 "Q" = 0.7071 } }
                { type = builtin name = out_R label = mixer control = { "Gain 1" = 1.0 "Gain 2" = 1.0 "Gain 3" = 1.0 "Gain 4" = 2.0 } }
                # ================= virtual bass (mono) =================
                { type = builtin name = vb_sum label = mixer control = { "Gain 1" = 0.5 "Gain 2" = 0.5 } }
                { type = builtin name = vb_lp1 label = bq_lowpass control = { "Freq" = 150.0 "Q" = 0.707 } }
                { type = builtin name = vb_lp2 label = bq_lowpass control = { "Freq" = 150.0 "Q" = 0.707 } }
                { type = builtin name = vb_abs label = abs }
                { type = builtin name = vb_hp1 label = bq_highpass control = { "Freq" = 100.0 "Q" = 0.707 } }
                { type = builtin name = vb_hp2 label = bq_highpass control = { "Freq" = 100.0 "Q" = 0.707 } }
                { type = builtin name = vb_out1 label = bq_lowpass control = { "Freq" = 650.0 "Q" = 0.707 } }
                { type = builtin name = vb_out2 label = bq_lowpass control = { "Freq" = 650.0 "Q" = 0.707 } }
                { type = ladspa name = vb_comp plugin = sc4m_1916 label = sc4m
                  control = { "RMS/peak" = 0.5 "Attack time (ms)" = 5.0 "Release time (ms)" = 150.0 "Threshold level (dB)" = -30.0 "Ratio (1:n)" = 4.0 "Knee radius (dB)" = 6.0 "Makeup gain (dB)" = 10.0 } }
                # ================= 3-band stereo-linked compressors (SWH SC4) =================
                { type = ladspa name = comp_low plugin = sc4_1882 label = sc4
                  control = { "RMS/peak" = 0.5 "Attack time (ms)" = 10.0 "Release time (ms)" = 200.0 "Threshold level (dB)" = -21.0 "Ratio (1:n)" = 3.0 "Knee radius (dB)" = 6.0 "Makeup gain (dB)" = 10.0 } }
                { type = ladspa name = comp_mid plugin = sc4_1882 label = sc4
                  control = { "RMS/peak" = 0.5 "Attack time (ms)" = 5.0 "Release time (ms)" = 120.0 "Threshold level (dB)" = -20.0 "Ratio (1:n)" = 3.0 "Knee radius (dB)" = 6.0 "Makeup gain (dB)" = 10.0 } }
                { type = ladspa name = comp_high plugin = sc4_1882 label = sc4
                  control = { "RMS/peak" = 0.5 "Attack time (ms)" = 3.0 "Release time (ms)" = 80.0 "Threshold level (dB)" = -22.0 "Ratio (1:n)" = 3.0 "Knee radius (dB)" = 6.0 "Makeup gain (dB)" = 10.0 } }
                # ================= brickwall limiter =================
                { type = ladspa name = limit plugin = fast_lookahead_limiter_1913 label = fastLookaheadLimiter
                  control = { "Input gain (dB)" = 0.0 "Limit (dB)" = -1.0 "Release time (s)" = 0.05 } }
            ]
            links = [
                { output = "in_L:Out" input = "hp1_L:In" }
                { output = "hp1_L:Out" input = "hp2_L:In" }
                { output = "hp2_L:Out" input = "lo_L:In" }
                { output = "lo_L:Out" input = "box_L:In" }
                { output = "box_L:Out" input = "res_L:In" }
                { output = "res_L:Out" input = "pres_L:In" }
                { output = "pres_L:Out" input = "air_L:In" }
                { output = "air_L:Out" input = "xl1_L:In" }
                { output = "xl1_L:Out" input = "xl2_L:In" }
                { output = "xl2_L:Out" input = "xlap_L:In" }
                { output = "air_L:Out" input = "xr1_L:In" }
                { output = "xr1_L:Out" input = "xr2_L:In" }
                { output = "xr2_L:Out" input = "xm1_L:In" }
                { output = "xm1_L:Out" input = "xm2_L:In" }
                { output = "xr2_L:Out" input = "xh1_L:In" }
                { output = "xh1_L:Out" input = "xh2_L:In" }
                { output = "xlap_L:Out" input = "comp_low:Left input" }
                { output = "xm2_L:Out" input = "comp_mid:Left input" }
                { output = "xh2_L:Out" input = "comp_high:Left input" }
                { output = "comp_low:Left output" input = "out_L:In 1" }
                { output = "comp_mid:Left output" input = "out_L:In 2" }
                { output = "comp_high:Left output" input = "out_L:In 3" }
                { output = "vb_comp:Output" input = "out_L:In 4" }
                { output = "in_L:Out" input = "vb_sum:In 1" }
                { output = "out_L:Out" input = "limit:Input 1" }
                { output = "in_R:Out" input = "hp1_R:In" }
                { output = "hp1_R:Out" input = "hp2_R:In" }
                { output = "hp2_R:Out" input = "lo_R:In" }
                { output = "lo_R:Out" input = "box_R:In" }
                { output = "box_R:Out" input = "res_R:In" }
                { output = "res_R:Out" input = "pres_R:In" }
                { output = "pres_R:Out" input = "air_R:In" }
                { output = "air_R:Out" input = "xl1_R:In" }
                { output = "xl1_R:Out" input = "xl2_R:In" }
                { output = "xl2_R:Out" input = "xlap_R:In" }
                { output = "air_R:Out" input = "xr1_R:In" }
                { output = "xr1_R:Out" input = "xr2_R:In" }
                { output = "xr2_R:Out" input = "xm1_R:In" }
                { output = "xm1_R:Out" input = "xm2_R:In" }
                { output = "xr2_R:Out" input = "xh1_R:In" }
                { output = "xh1_R:Out" input = "xh2_R:In" }
                { output = "xlap_R:Out" input = "comp_low:Right input" }
                { output = "xm2_R:Out" input = "comp_mid:Right input" }
                { output = "xh2_R:Out" input = "comp_high:Right input" }
                { output = "comp_low:Right output" input = "out_R:In 1" }
                { output = "comp_mid:Right output" input = "out_R:In 2" }
                { output = "comp_high:Right output" input = "out_R:In 3" }
                { output = "vb_comp:Output" input = "out_R:In 4" }
                { output = "in_R:Out" input = "vb_sum:In 2" }
                { output = "out_R:Out" input = "limit:Input 2" }
                { output = "vb_sum:Out" input = "vb_lp1:In" }
                { output = "vb_lp1:Out" input = "vb_lp2:In" }
                { output = "vb_lp2:Out" input = "vb_abs:In" }
                { output = "vb_abs:Out" input = "vb_hp1:In" }
                { output = "vb_hp1:Out" input = "vb_hp2:In" }
                { output = "vb_hp2:Out" input = "vb_out1:In" }
                { output = "vb_out1:Out" input = "vb_out2:In" }
                { output = "vb_out2:Out" input = "vb_comp:Input" }
            ]
            inputs  = [ "in_L:In" "in_R:In" ]
            outputs = [ "limit:Output 1" "limit:Output 2" ]
        }
        capture.props = {
            node.name      = "effect_input.speakers_dsp"
            media.class    = Audio/Sink
            audio.channels = 2
            audio.position = [ FL FR ]
            priority.session = 2000
        }
        playback.props = {
            node.name      = "effect_output.speakers_dsp"
            node.passive   = true
            audio.channels = 2
            audio.position = [ FL FR ]
            target.object  = "alsa_output.pci-0000_00_1f.3.analog-stereo"
            node.dont-reconnect = true
        }
    }
}
]
